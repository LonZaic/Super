# ══════════════════════════════════════════════════════
# DeepSeek-Super Docker Compose — 一键本地部署
#
# 使用方法:
#   1. 克隆仓库: git clone https://github.com/yourname/DeepSeek-Super.git
#   2. 进入目录: cd DeepSeek-Super
#   3. 复制环境变量: cp .env.example .env (然后填入你的 DEEPSEEK_API_KEY)
#   4. 一键启动: docker compose up -d
#   5. 打开浏览器: http://localhost:3001
#
# 数据持久化:
#   - 数据库: ./data/deepseek-super.sqlite
#   - 工作区: ./workspace/
# ══════════════════════════════════════════════════════

services:
  deepseek-super:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepseek-super
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/deepseek-super.sqlite
      - AGENT_WORKSPACE=/app/workspace
    volumes:
      # 数据库持久化 — 所有数据存在本地
      - ./data:/app/data
      # Agent 工作区持久化
      - ./workspace:/app/workspace
      # 记忆目录持久化
      - ./memory:/app/server/engine/memory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const req = http.get('http://localhost:3001/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }); req.on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
